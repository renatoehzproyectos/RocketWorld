<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>RocketWorld</title>
<style>
html,body{margin:0;height:100%;background:#0a0e14;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0e14;z-index:9;transition:opacity .5s}
#loading h1{font-weight:800;letter-spacing:.2em;margin:0 0 12px}
#hud{position:fixed;left:12px;top:10px;font:12px/1.4 ui-monospace,monospace;opacity:.85;pointer-events:none;text-shadow:0 1px 3px #000;white-space:pre}
#boostbar{position:fixed;right:14px;top:14px;width:120px;height:10px;border:1px solid #fff8;border-radius:6px;overflow:hidden}
#boostfill{height:100%;width:0;background:#ffb020}
#help{position:fixed;left:12px;bottom:10px;font:11px/1.4 system-ui;opacity:.7;pointer-events:none;text-shadow:0 1px 3px #000}
#mobile{position:fixed;inset:0;pointer-events:none;display:none}
.btn{position:absolute;pointer-events:auto;border:2px solid #fff6;background:#0008;color:#fff;border-radius:50%;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
#joy{position:absolute;left:24px;bottom:24px;width:140px;height:140px;border-radius:50%;border:2px solid #fff5;background:#0005;pointer-events:auto}
#knob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:#fffa}
</style></head><body>
<canvas id="c"></canvas>
<div id="loading"><h1>ROCKETWORLD</h1><div id="status">Cargando…</div></div>
<div id="hud"></div>
<div id="help">WASD conducir · Espacio salto · Shift boost · Ctrl/X derrape · Q/E air-roll · C cámara · R reiniciar</div>
<div id="mobile">
  <div id="joy"><div id="knob"></div></div>
  <div class="btn" data-k="jump"  style="right:24px;bottom:34px;width:84px;height:84px">JUMP</div>
  <div class="btn" data-k="boost" style="right:122px;bottom:24px;width:68px;height:68px;background:#a60b">BOOST</div>
  <div class="btn" data-k="slide" style="right:130px;bottom:104px;width:52px;height:52px">SLIDE</div>
  <div class="btn" data-k="rl" style="right:24px;bottom:130px;width:48px;height:48px">⟲</div>
  <div class="btn" data-k="rr" style="right:80px;bottom:150px;width:48px;height:48px">⟳</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script type="module" src="src/main.js"></script>
</body></html>
