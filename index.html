<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="theme-color" content="#0a0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>RocketWorld</title>
    <script>
      window.CESIUM_BASE_URL = '/cesium/';
    </script>
    <link rel="stylesheet" href="/cesium/Widgets/widgets.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0a0e14;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #cesiumContainer {
        position: fixed;
        inset: 0;
        z-index: 0;
        display: none;
      }
      #c {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: block;
        width: 100%;
        height: 100%;
      }
      #loader {
        position: fixed;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(ellipse at 50% 30%, #1a3a55 0%, #0a0e14 70%);
        color: #e8f4ff;
        transition: opacity 0.45s ease;
      }
      #loader.hide {
        opacity: 0;
        pointer-events: none;
      }
      #loader h1 {
        margin: 0 0 8px;
        font-weight: 700;
        letter-spacing: 0.06em;
        font-size: 1.6rem;
      }
      #loader p {
        margin: 0 0 20px;
        color: #8ab4c8;
        font-size: 0.95rem;
      }
      #loader .bar {
        width: min(240px, 70vw);
        height: 4px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 2px;
        overflow: hidden;
      }
      #loader .bar > i {
        display: block;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, #ff8a20, #ffcc66);
        animation: load 1.1s ease-in-out infinite;
      }
      @keyframes load {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(280%);
        }
      }
      #status {
        position: fixed;
        left: 12px;
        bottom: 12px;
        color: #e8f4ff;
        font-size: 13px;
        pointer-events: none;
        text-shadow: 0 1px 3px #000;
        z-index: 10;
      }
      #hint {
        position: fixed;
        right: 12px;
        bottom: 12px;
        color: #a0c4d8;
        font-size: 12px;
        z-index: 10;
        text-shadow: 0 1px 2px #000;
        pointer-events: none;
        max-width: 45vw;
        text-align: right;
      }
      #error {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(10, 14, 20, 0.92);
        color: #ffb4b4;
        padding: 24px;
        text-align: center;
      }
      #error.show {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <canvas id="c"></canvas>
    <div id="loader">
      <h1>ROCKETWORLD</h1>
      <p id="loaderMsg">Loading RocketSim…</p>
      <div class="bar"><i></i></div>
    </div>
    <div id="error"></div>
    <div id="status"></div>
    <div id="hint">WASD · Space · Shift · F3 · C · Touch OK</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="/cesium/Cesium.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
